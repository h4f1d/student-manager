<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Manager</title>
  <meta name="description" content="A simple application for managing student information: add, edit, search and delete students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <a class="back" href="../index.html#projects">Back to portfolio</a>

    <header class="head">
      <h1>Student Manager</h1>
      <p>Add, edit and search students. Everything is saved in your browser.</p>
    </header>

    <p class="stats" aria-live="polite">
      <span id="stat-count">0 students</span>
      <span id="stat-avg">No average yet</span>
    </p>

    <form class="form" id="form" autocomplete="off">
      <label>Full name
        <input id="name" required maxlength="60">
      </label>
      <label>Group
        <input id="group" required maxlength="20" placeholder="e.g. DD101">
      </label>
      <label>Grade (out of 20)
        <input id="grade" type="number" min="0" max="20" step="0.25" required>
      </label>
      <div class="form-actions">
        <button class="btn btn--primary" type="submit" id="submit">Add student</button>
        <button class="btn" type="button" id="cancel" hidden>Cancel</button>
      </div>
    </form>

    <div class="list-head">
      <h2>Students</h2>
      <input type="search" id="search" placeholder="Search by name or group" aria-label="Search students">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th scope="col">Name</th><th scope="col">Group</th><th scope="col">Grade</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
